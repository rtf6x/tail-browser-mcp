services:
  # One MCP server for all browser extension installs.
  # Each extension: unique browserId in Options, WebSocket port 18789.
  tail-browser-mcp:
    build: .
    image: tail-browser-mcp
    container_name: tail-browser-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:18789:18789"
      - "127.0.0.1:18790:18790"
    environment:
      EXTENSION_PORT: "18789"
      MCP_HTTP_PORT: "18790"
      CONTAINERIZED: "true"
      # Optional: EXTENSION_SECRET=${EXTENSION_SECRET}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
