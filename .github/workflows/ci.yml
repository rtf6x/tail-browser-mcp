name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build common, mcp-server, extensions
        run: npm run build

      - name: Firefox extension unit tests
        run: cd firefox-extension && npm test

      - name: Typecheck mcp-server
        run: cd mcp-server && npx tsc --noEmit

      - name: Pack extensions (Firefox XPI + AMO source zip + Chrome zip)
        run: npm run pack:extensions

      - name: Upload packaged extensions
        uses: actions/upload-artifact@v4
        with:
          name: extensions-${{ github.sha }}
          path: |
            tail-mcp-chrome.zip
            tail-mcp-dev.xpi
            tail-mcp-firefox-source.zip
          retention-days: 14
