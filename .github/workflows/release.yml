name: Build and Release extensions

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build common
      run: npm run build --prefix common

    - name: Build and pack browser extensions
      run: npm run pack:extensions

    - name: Pack MCPB bundle (Claude Desktop)
      run: npm run pack:mcpb

    - name: Rename extension packages with version
      run: |
        mv tail-mcp-chrome.zip tail-mcp-chrome-${{ github.event.release.tag_name }}.zip
        mv tail-mcp-dev.xpi tail-mcp-firefox-${{ github.event.release.tag_name }}.xpi
        mv tail-mcp-firefox-source.zip tail-mcp-firefox-source-${{ github.event.release.tag_name }}.zip
        mv tail-mcp-desktop-*.mcpb tail-mcp-desktop-${{ github.event.release.tag_name }}.mcpb

    - name: Upload packages to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload ${{ github.event.release.tag_name }} \
          ./tail-mcp-chrome-${{ github.event.release.tag_name }}.zip \
          ./tail-mcp-firefox-${{ github.event.release.tag_name }}.xpi \
          ./tail-mcp-firefox-source-${{ github.event.release.tag_name }}.zip \
          ./tail-mcp-desktop-${{ github.event.release.tag_name }}.mcpb \
          --clobber

