name: Build and Release extensions

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build common
      run: npm run build --prefix common

    - name: Build and pack browser extensions
      run: npm run pack:extensions

    - name: Rename extension packages with version
      run: |
        mv tail-mcp-chrome.zip tail-mcp-chrome-${{ github.event.release.tag_name }}.zip
        mv tail-mcp-dev.xpi tail-mcp-firefox-${{ github.event.release.tag_name }}.xpi
        mv tail-mcp-firefox-source.zip tail-mcp-firefox-source-${{ github.event.release.tag_name }}.zip

    - name: Upload packages to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload ${{ github.event.release.tag_name }} \
          ./tail-mcp-chrome-${{ github.event.release.tag_name }}.zip \
          ./tail-mcp-firefox-${{ github.event.release.tag_name }}.xpi \
          ./tail-mcp-firefox-source-${{ github.event.release.tag_name }}.zip \
          --clobber

  build-desktop-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Linux Tauri build dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf build-essential

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: desktop-app/src-tauri

    - name: Install common dependencies
      working-directory: common
      run: npm install

    - name: Install mcp-server dependencies
      working-directory: mcp-server
      run: npm install

    - name: Build common
      working-directory: common
      run: npm run build

    - name: Build sidecar for ${{ matrix.target }}
      working-directory: mcp-server
      run: node scripts/build-sidecar.mjs ${{ matrix.target }} ../desktop-app/src-tauri/binaries

    - name: Build Tauri app
      working-directory: desktop-app/src-tauri
      run: npx --yes @tauri-apps/cli@latest build

    - name: Upload desktop bundles to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        assets=()
        while IFS= read -r -d '' f; do
          assets+=("$f")
        done < <(find desktop-app/src-tauri/target/release/bundle \
          -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -print0)
        if [ "${#assets[@]}" -eq 0 ]; then
          echo "No desktop bundle artifacts found for ${{ matrix.target }}" >&2
          exit 1
        fi
        gh release upload ${{ github.event.release.tag_name }} "${assets[@]}" --clobber
