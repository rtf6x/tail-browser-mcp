name: Build and Release extensions + MCP Server DXT

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Build common and MCP server
      run: |
        npm run build --prefix common
        cd mcp-server && npm run build && npm run pack-dxt

    - name: Rename DXT package with version
      run: |
        cd mcp-server
        mv mcp-server.dxt mcp-server-${{ github.event.release.tag_name }}.dxt

    - name: Build and pack browser extensions
      run: npm run pack:extensions

    - name: Rename extension packages with version
      run: |
        mv tail-mcp-chrome.zip tail-mcp-chrome-${{ github.event.release.tag_name }}.zip
        mv tail-mcp-dev.xpi tail-mcp-firefox-${{ github.event.release.tag_name }}.xpi
        mv tail-mcp-firefox-source.zip tail-mcp-firefox-source-${{ github.event.release.tag_name }}.zip

    - name: Upload packages to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload ${{ github.event.release.tag_name }} \
          ./mcp-server/mcp-server-${{ github.event.release.tag_name }}.dxt \
          ./tail-mcp-chrome-${{ github.event.release.tag_name }}.zip \
          ./tail-mcp-firefox-${{ github.event.release.tag_name }}.xpi \
          ./tail-mcp-firefox-source-${{ github.event.release.tag_name }}.zip \
          --clobber
