[package]
name = "tail-mcp-desktop"
version = "2.0.12"
description = "Tail MCP tray app — runs the Tail MCP server as a background process with a menu-bar/tray icon"
authors = ["rtf6x"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
parking_lot = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
